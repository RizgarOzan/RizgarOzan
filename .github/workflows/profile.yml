name: profile

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/profile.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if anything changed
        run: |
          git add -A assets README.md
          git diff --cached --quiet && exit 0
          git config user.name "Rızgar Ozan"
          git config user.email "rizgarozan7@gmail.com"
          git commit -m "Refresh profile stats"
          git push
